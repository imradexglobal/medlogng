name: Build offline speech assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-speech-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64-assets:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out the approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Node.js for repository build scripts
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.18.0

      - name: Install official MSYS2 UCRT64 build tools
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          cache: false
          path-type: minimal
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nasm
            gnupg

      - name: Confirm Windows build tools
        shell: pwsh
        run: |
          node --version
          git --version
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio Build Tools were not found on the Windows 2022 runner.' }
          & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw 'MSVC x64 tools were not found on the Windows 2022 runner.' }

      - name: Build, sign-check and stage official FFmpeg source
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-ffmpeg.ps1

      - name: Build pinned Whisper worker and verify all assets
        shell: pwsh
        run: |
          npm run speech:build
          if ($LASTEXITCODE -ne 0) { throw 'Whisper worker build failed.' }
          npm run speech:verify
          if ($LASTEXITCODE -ne 0) { throw 'Speech asset verification failed.' }

      - name: Smoke-test real worker transcription with pinned audio
        shell: pwsh
        run: |
          $worker = Join-Path $PWD 'vendor/speech/medilog-whisper-worker.exe'
          $model = Join-Path $PWD 'vendor/speech/ggml-tiny.en-q5_1.bin'
          $audio = Join-Path $env:RUNNER_TEMP 'speech-test-audio'
          $null = New-Item -ItemType Directory -Force -Path $audio
          $sample = Join-Path $PWD '.cache/whisper.cpp-v1.9.5/samples/jfk.wav'
          $sampleHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sample).Hash
          if ($sampleHash -ne '59DFB9A4ACB36FE2A2AFFC14BACBEE2920FF435CB13CC314A08C13F66BA7860E') {
            throw 'Pinned whisper.cpp JFK test audio hash did not match.'
          }
          $testWav = Join-Path $audio 'jfk.wav'
          Copy-Item -LiteralPath $sample -Destination $testWav
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $worker
          $start.ArgumentList.Add('--model'); $start.ArgumentList.Add($model)
          $start.ArgumentList.Add('--audio-dir'); $start.ArgumentList.Add($audio)
          $start.ArgumentList.Add('--threads'); $start.ArgumentList.Add('1')
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [Diagnostics.Process]::new()
          $process.StartInfo = $start
          if (-not $process.Start()) { throw 'Could not start the real Whisper worker.' }
          try {
            $readyTask = $process.StandardOutput.ReadLineAsync()
            $readyReceived = $readyTask.Wait([TimeSpan]::FromMinutes(3))
            if (-not $readyReceived -and -not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
            if (-not $readyReceived -or $readyTask.Result -ne 'READY') {
              $stderr = $process.StandardError.ReadToEnd()
              throw ('Worker did not load the model: ' + $stderr)
            }
            $process.StandardInput.WriteLine("ci-jfk`t$testWav")
            $responseTask = $process.StandardOutput.ReadLineAsync()
            if (-not $responseTask.Wait([TimeSpan]::FromMinutes(3))) { throw 'Real audio transcription timed out.' }
            $response = $responseTask.Result -split "`t", 3
            if ($response.Count -ne 3 -or $response[0] -ne 'ci-jfk' -or $response[1] -ne 'OK') {
              throw ('Worker rejected pinned test audio: ' + ($response -join "`t"))
            }
            $transcript = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($response[2])).ToLowerInvariant()
            if ($transcript -notmatch 'ask not what your country can do for you' -or
                $transcript -notmatch 'ask what you can do for your country') {
              throw ('Real worker transcription did not contain expected JFK phrases: ' + $transcript)
            }
            Write-Host ('Real pinned audio transcription passed. Transcript: ' + $transcript)
            $process.StandardInput.WriteLine('QUIT')
            if (-not $process.WaitForExit(30000) -or $process.ExitCode -ne 0) { throw 'Worker did not stop cleanly after transcription.' }
          } finally {
            if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit() }
            $process.Dispose()
          }

      - name: Smoke-test the built FFmpeg executable
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $PWD 'vendor/speech/ffmpeg.exe'
          $input = Join-Path $env:RUNNER_TEMP 'speech-input.wav'
          $output = Join-Path $env:RUNNER_TEMP 'speech-output.wav'
          $pcm = [byte[]]::new(3200)
          $wav = [byte[]]::new(44 + $pcm.Length)
          [Text.Encoding]::ASCII.GetBytes('RIFF').CopyTo($wav, 0)
          [BitConverter]::GetBytes([uint32]($wav.Length - 8)).CopyTo($wav, 4)
          [Text.Encoding]::ASCII.GetBytes('WAVE').CopyTo($wav, 8)
          [Text.Encoding]::ASCII.GetBytes('fmt ').CopyTo($wav, 12)
          [BitConverter]::GetBytes([uint32]16).CopyTo($wav, 16)
          [BitConverter]::GetBytes([uint16]1).CopyTo($wav, 20)
          [BitConverter]::GetBytes([uint16]1).CopyTo($wav, 22)
          [BitConverter]::GetBytes([uint32]16000).CopyTo($wav, 24)
          [BitConverter]::GetBytes([uint32]32000).CopyTo($wav, 28)
          [BitConverter]::GetBytes([uint16]2).CopyTo($wav, 32)
          [BitConverter]::GetBytes([uint16]16).CopyTo($wav, 34)
          [Text.Encoding]::ASCII.GetBytes('data').CopyTo($wav, 36)
          [BitConverter]::GetBytes([uint32]$pcm.Length).CopyTo($wav, 40)
          [Array]::Copy($pcm, 0, $wav, 44, $pcm.Length)
          [IO.File]::WriteAllBytes($input, $wav)
          & $ffmpeg -nostdin -hide_banner -loglevel error -y -i $input -map 0:a:0 -vn -ac 1 -ar 16000 -c:a pcm_s16le $output
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output) -or (Get-Item $output).Length -lt 44) {
            throw 'The packaged FFmpeg executable failed a WAV conversion smoke test.'
          }

      - name: Run mocked worker, queue and asset regression tests
        shell: pwsh
        run: |
          npm run test:speech
          if ($LASTEXITCODE -ne 0) { throw 'Speech mock/queue/asset regression tests failed.' }

      - name: Upload verified runtime assets and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: medilog-offline-speech-assets-windows-x64
          if-no-files-found: error
          path: |
            vendor/speech/medilog-whisper-worker.exe
            vendor/speech/ggml-tiny.en-q5_1.bin
            vendor/speech/ffmpeg.exe
            vendor/speech/speech-assets.json
            vendor/speech/ffmpeg-build.json
            vendor/speech/ffmpeg-source/ffmpeg-9.0.2.tar.xz
            vendor/speech/ffmpeg-source/ffmpeg-9.0.2.tar.xz.asc
            vendor/speech/ffmpeg-source/ffmpeg-devel.asc
            vendor/speech/COPYING.LGPLv2.1
            vendor/speech/LICENSE-whisper.cpp.txt

appId: com.medilogng.app
productName: MediLog NG
copyright: Copyright (c) Imradex Global
artifactName: MediLogNG-Setup-${version}.${ext}

directories:
  output: release
  buildResources: public

asar: true

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/@capacitor/android/**/*'
  - '!node_modules/@capacitor/cli/**/*'
  - '!node_modules/firebase-admin/**/*'

win:
  icon: public/icon.ico
  target:
    - target: nsis
      arch: [x64]
  publisherName: Imradex Global
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MediLog NG
  menuCategory: Imradex Global
  deleteAppDataOnUninstall: true
  differentialPackage: false

publish:
  provider: github
  owner: imradexglobal
  repo: medlogng
  channel: latest
